<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=Lift">
    
    <title>Workout Tracker</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SortableJS for Touch-Friendly Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }
        
        .header-bar-container {
            position: sticky;
            top: 0;
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
            z-index: 1000;
            padding-top: env(safe-area-inset-top);
        }
        
        .header-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: calc(env(safe-area-inset-bottom) + 3rem);
        }

        .exercise-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none; 
        }
        
        .drag-handle {
            font-size: 1.5rem; 
            cursor: grab; 
            touch-action: none; 
            margin-left: -0.5rem;
        }
        
        .sortable-ghost {
            opacity: 0.4;
            background-color: #2a2a2a;
        }

        /* Styling for the editable text input */
        .exercise-title-input {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0;
            margin-left: 0.5rem;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        
        /* Adds a subtle blue line when actively typing */
        .exercise-title-input:focus {
            outline: none;
            border-bottom: 1px solid #0d6efd;
            border-radius: 0;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 0.25rem;
        }
        .control-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #3a3a3a;
            color: #fff;
            border: none;
            font-size: 1.5rem;
            touch-action: manipulation;
        }
        .control-btn:active {
            background: #4a4a4a;
        }
        .control-value {
            font-size: 1.2rem;
            font-weight: 600;
            width: 70px;
            text-align: center;
            color: #e0e0e0;
        }
        .control-label {
            font-size: 0.85rem;
            color: #9e9e9e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header-bar-container">
        <div class="header-content">
            <h5 class="mb-0 text-white"><i class="bi bi-activity text-primary me-2"></i>Workout Tracker</h5>
            <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#addExerciseModal">
                <i class="bi bi-plus-lg"></i> Add
            </button>
        </div>
    </div>

    <div class="app-wrapper" id="exercise-list">
        <!-- Exercises will be injected here by JS -->
    </div>

    <!-- Add Exercise Modal -->
    <div class="modal fade" id="addExerciseModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary mx-3">
          <div class="modal-header border-secondary">
            <h5 class="modal-title">Add Exercise</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="text" id="newExName" class="form-control bg-dark text-light border-secondary mb-3" placeholder="Exercise Name">
            <div class="row g-2">
                <div class="col-4">
                    <label class="form-label text-muted small">Weight (kg)</label>
                    <input type="number" id="newExWeight" class="form-control bg-dark text-light border-secondary" value="20">
                </div>
                <div class="col-4">
                    <label class="form-label text-muted small">Sets</label>
                    <input type="number" id="newExSets" class="form-control bg-dark text-light border-secondary" value="3">
                </div>
                <div class="col-4">
                    <label class="form-label text-muted small">Reps</label>
                    <input type="number" id="newExReps" class="form-control bg-dark text-light border-secondary" value="10">
                </div>
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-primary w-100 rounded-pill" onclick="addExercise()" data-bs-dismiss="modal">Add to Workout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const defaultExercises = [
            { id: 1, name: "Dumbbell Bench Press", weight: 20, sets: 3, reps: 10 },
            { id: 2, name: "Kettlebell Swings", weight: 12, sets: 4, reps: 15 },
            { id: 3, name: "Push-ups", weight: 0, sets: 3, reps: 20 }
        ];

        let exercises = JSON.parse(localStorage.getItem('workoutData')) || defaultExercises;

        function saveData() {
            localStorage.setItem('workoutData', JSON.stringify(exercises));
        }

        // Saves the new name when the input field loses focus or the user hits return
        function updateName(id, newName) {
            const index = exercises.findIndex(ex => ex.id === id);
            if (index !== -1) {
                exercises[index].name = newName;
                saveData();
                // We do not call render() here so the keyboard doesn't violently close while typing
            }
        }

        function updateValue(id, field, delta) {
            const index = exercises.findIndex(ex => ex.id === id);
            if (index !== -1) {
                let step = field === 'weight' ? 2.5 : 1; 
                exercises[index][field] = Math.max(0, exercises[index][field] + (delta * step));
                
                if(field === 'weight') {
                    exercises[index][field] = parseFloat(exercises[index][field].toFixed(1));
                }
                saveData();
                render(); 
            }
        }

        function deleteExercise(id) {
            if(confirm("Remove this exercise?")) {
                exercises = exercises.filter(ex => ex.id !== id);
                saveData();
                render();
            }
        }

        function addExercise() {
            const name = document.getElementById('newExName').value || 'New Exercise';
            const weight = parseFloat(document.getElementById('newExWeight').value) || 0;
            const sets = parseInt(document.getElementById('newExSets').value) || 0;
            const reps = parseInt(document.getElementById('newExReps').value) || 0;

            exercises.push({
                id: Date.now(),
                name: name,
                weight: weight,
                sets: sets,
                reps: reps
            });
            
            document.getElementById('newExName').value = '';
            saveData();
            render();
        }

        function render() {
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            
            if (exercises.length === 0) {
                list.innerHTML = '<div class="text-center text-muted mt-5">No exercises added. Tap + Add to start.</div>';
                return;
            }

            exercises.forEach(ex => {
                list.innerHTML += `
                    <div class="exercise-card p-3 p-md-4" data-id="${ex.id}">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center w-100 me-3">
                                <i class="bi bi-grid-3x2-gap-fill text-secondary drag-handle"></i>
                                <input type="text" 
                                       class="exercise-title-input" 
                                       value="${ex.name}" 
                                       onchange="updateName(${ex.id}, this.value)"
                                       autocomplete="off" 
                                       autocorrect="off" 
                                       spellcheck="false">
                            </div>
                            <button class="btn btn-link text-danger p-0" onclick="deleteExercise(${ex.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        
                        <div class="row g-3">
                            <div class="col-12 mb-1">
                                <div class="control-label">Weight (kg)</div>
                                <div class="control-group">
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'weight', -1)">-</button>
                                    <div class="control-value">${ex.weight}</div>
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'weight', 1)">+</button>
                                </div>
                            </div>
                            
                            <div class="col-6">
                                <div class="control-label">Sets</div>
                                <div class="control-group">
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'sets', -1)">-</button>
                                    <div class="control-value">${ex.sets}</div>
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'sets', 1)">+</button>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="control-label">Reps</div>
                                <div class="control-group">
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'reps', -1)">-</button>
                                    <div class="control-value">${ex.reps}</div>
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'reps', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        render();

        const listContainer = document.getElementById('exercise-list');
        new Sortable(listContainer, {
            handle: '.drag-handle', 
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                const movedItem = exercises.splice(evt.oldIndex, 1)[0];
                exercises.splice(evt.newIndex, 0, movedItem);
                saveData();
            }
        });
    </script>
</body>
</html>
