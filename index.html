<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <link rel="apple-touch-icon" href="icon.jpg">

    <title>Workout Tracker</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SortableJS for Touch-Friendly Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }

        .header-bar-container {
            position: sticky;
            top: 0;
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
            z-index: 1000;
            padding-top: env(safe-area-inset-top);
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            padding-bottom: calc(env(safe-area-inset-bottom) + 3rem);
        }

        .exercise-card {
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            user-select: none;
            transition: background-color 0.3s ease;
        }

        /* Alternating Colors for Readability */
        .exercise-card:nth-child(odd) {
            background-color: #1a365d;
            /* Deep Blue */
        }

        .exercise-card:nth-child(even) {
            background-color: #1e3f32;
            /* Deep Forest Green */
        }

        .drag-handle {
            font-size: 1.25rem;
            cursor: grab;
            touch-action: none;
            color: rgba(255, 255, 255, 0.5);
        }

        .sortable-ghost {
            opacity: 0.5;
            background-color: #2d3748 !important;
            /* Neutral dragging color */
        }

        .exercise-title-input {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .exercise-title-input:focus {
            outline: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 0;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.25);
            /* Translucent dark background */
            border-radius: 6px;
            padding: 0.15rem;
        }

        .left-handed .control-group {
            justify-content: flex-start;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .left-handed .exercise-header {
            flex-direction: row-reverse;
        }

        .exercise-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-left: 0.75rem;
        }

        .left-handed .exercise-controls {
            margin-left: 0;
            margin-right: 0.75rem;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            /* Translucent button */
            color: #fff;
            border: none;
            font-size: 1.25rem;
            touch-action: manipulation;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .control-value {
            font-size: 1rem;
            font-weight: 600;
            width: 55px;
            text-align: center;
            color: #ffffff;
        }

        .control-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.15rem;
            font-weight: 500;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <div class="header-bar-container">
        <div class="header-content">
            <h6 class="mb-0 text-white"><i class="bi bi-activity text-primary me-2"></i>Workout Tracker</h6>
            <div>
                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1 me-2"
                    onclick="toggleHandedness()">
                    <i class="bi bi-hand-index-thumb"></i>
                </button>
                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1 me-2"
                    onclick="window.location.reload();">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button class="btn btn-primary btn-sm rounded-pill px-3 py-1" data-bs-toggle="modal"
                    data-bs-target="#addExerciseModal">
                    <i class="bi bi-plus-lg"></i> Add
                </button>
            </div>
        </div>
    </div>

    <div class="app-wrapper" id="exercise-list">
        <!-- Exercises will be injected here by JS -->
    </div>

    <!-- Add Exercise Modal -->
    <div class="modal fade" id="addExerciseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary mx-3">
                <div class="modal-header border-secondary py-2">
                    <h6 class="modal-title">Add Exercise</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="newExName"
                        class="form-control form-control-sm bg-dark text-light border-secondary mb-3"
                        placeholder="Exercise Name">
                    <div class="row g-2">
                        <div class="col-4">
                            <label class="form-label text-muted small mb-1">Weight (kg)</label>
                            <input type="number" id="newExWeight"
                                class="form-control form-control-sm bg-dark text-light border-secondary" value="20">
                        </div>
                        <div class="col-4">
                            <label class="form-label text-muted small mb-1">Sets</label>
                            <input type="number" id="newExSets"
                                class="form-control form-control-sm bg-dark text-light border-secondary" value="3">
                        </div>
                        <div class="col-4">
                            <label class="form-label text-muted small mb-1">Reps</label>
                            <input type="number" id="newExReps"
                                class="form-control form-control-sm bg-dark text-light border-secondary" value="10">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary py-2">
                    <button type="button" class="btn btn-primary btn-sm w-100 rounded-pill" onclick="addExercise()"
                        data-bs-dismiss="modal">Add to Workout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const defaultExercises = [
            { id: 1, name: "Dumbbell Bench Press", weight: 20, sets: 3, reps: 10 },
            { id: 2, name: "Kettlebell Swings", weight: 12, sets: 4, reps: 15 },
            { id: 3, name: "Push-ups", weight: 0, sets: 3, reps: 20 }
        ];

        let exercises = JSON.parse(localStorage.getItem('workoutData')) || defaultExercises;
        
        let isLeftHanded = localStorage.getItem('isLeftHanded') === 'true';
        if (isLeftHanded) document.body.classList.add('left-handed');

        function toggleHandedness() {
            isLeftHanded = !isLeftHanded;
            localStorage.setItem('isLeftHanded', isLeftHanded);
            document.body.classList.toggle('left-handed', isLeftHanded);
        }

        function saveData() {
            localStorage.setItem('workoutData', JSON.stringify(exercises));
        }

        function updateName(id, newName) {
            const index = exercises.findIndex(ex => ex.id === id);
            if (index !== -1) {
                exercises[index].name = newName;
                saveData();
            }
        }

        function updateValue(id, field, delta) {
            const index = exercises.findIndex(ex => ex.id === id);
            if (index !== -1) {
                let step = field === 'weight' ? 2.5 : 1;
                exercises[index][field] = Math.max(0, exercises[index][field] + (delta * step));

                if (field === 'weight') {
                    exercises[index][field] = parseFloat(exercises[index][field].toFixed(1));
                }
                saveData();
                render();
            }
        }

        function deleteExercise(id) {
            if (confirm("Remove this exercise?")) {
                exercises = exercises.filter(ex => ex.id !== id);
                saveData();
                render();
            }
        }

        function addExercise() {
            const name = document.getElementById('newExName').value || 'New Exercise';
            const weight = parseFloat(document.getElementById('newExWeight').value) || 0;
            const sets = parseInt(document.getElementById('newExSets').value) || 0;
            const reps = parseInt(document.getElementById('newExReps').value) || 0;

            exercises.push({
                id: Date.now(),
                name: name,
                weight: weight,
                sets: sets,
                reps: reps
            });

            document.getElementById('newExName').value = '';
            saveData();
            render();
        }

        function render() {
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';

            if (exercises.length === 0) {
                list.innerHTML = '<div class="text-center text-muted mt-5">No exercises added. Tap + Add to start.</div>';
                return;
            }

            exercises.forEach(ex => {
                list.innerHTML += `
                    <div class="exercise-card p-2" data-id="${ex.id}">
                        <div class="exercise-header">
                            <div class="flex-grow-1">
                                <input type="text" 
                                       class="exercise-title-input" 
                                       value="${ex.name}" 
                                       onchange="updateName(${ex.id}, this.value)"
                                       autocomplete="off" 
                                       autocorrect="off" 
                                       spellcheck="false">
                            </div>
                            <div class="exercise-controls">
                                <i class="bi bi-grid-3x2-gap-fill drag-handle"></i>
                                <button class="btn btn-link text-danger p-0" onclick="deleteExercise(${ex.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="row g-2">
                            <div class="col-12">
                                <div class="control-label">Weight (kg)</div>
                                <div class="control-group">
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'weight', -1)">-</button>
                                    <div class="control-value">${ex.weight}</div>
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'weight', 1)">+</button>
                                </div>
                            </div>
                            
                            <div class="col-6">
                                <div class="control-label">Sets</div>
                                <div class="control-group">
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'sets', -1)">-</button>
                                    <div class="control-value">${ex.sets}</div>
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'sets', 1)">+</button>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="control-label">Reps</div>
                                <div class="control-group">
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'reps', -1)">-</button>
                                    <div class="control-value">${ex.reps}</div>
                                    <button class="control-btn" onclick="updateValue(${ex.id}, 'reps', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        render();

        const listContainer = document.getElementById('exercise-list');
        new Sortable(listContainer, {
            handle: '.drag-handle',
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                const movedItem = exercises.splice(evt.oldIndex, 1)[0];
                exercises.splice(evt.newIndex, 0, movedItem);
                saveData();
            }
        });
    </script>
</body>

</html>
